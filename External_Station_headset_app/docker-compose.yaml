version: '3.8'

services:
  # Service 1: The Database
  db:
    image: postgres:15-alpine
    env_file:
      - ./backend/.env
    ports:
      - "5433:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Service 2: The Backend 
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"  
    volumes:
      - ./backend/app:/code/app
    depends_on:
      - db
      - mqtt_broker

  # Service 3: The MQTT Broker (shared with the MR headset app over the LAN)
  mqtt_broker:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      # Host port 11883: Windows/Hyper-V often reserves 1835-1934, which blocks 1883.
      # The backend talks to mqtt_broker:1883 inside Docker; the headset uses <PC LAN IP>:11883.
      - "11883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data

  # Service 4: The Frontend
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data: